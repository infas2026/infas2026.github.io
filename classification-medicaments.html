button{font:inherit;font-weight:700;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}

.info{font-size:13px;color:var(--muted)}
main{max-width:820px;margin:0 auto;padding:10px 12px 60px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft)}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--brand);font-weight:800}
details[open] summary::after{content:"－"}
summary small{font-weight:600;color:var(--muted);margin-left:auto;white-space:nowrap}
.body{padding:6px 14px 12px}
.sec{margin:14px 0 4px;font-weight:800;color:var(--brand);font-size:16px}
.it{margin:7px 0;overflow-wrap:anywhere}
.it b{font-weight:800}
.it.sub{margin-left:18px;position:relative}
.it.sub::before{content:"•";position:absolute;left:-13px;color:var(--brand)}
.it.nb{background:var(--nb);color:var(--nbink);border-radius:8px;padding:6px 10px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;min-width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.lock{max-width:820px;margin:8px auto 0;padding:10px 12px;background:var(--nb);color:var(--nbink);border-radius:10px;font-size:14px;font-weight:600}
.lock[hidden]{display:none}
.none{padding:24px 8px;text-align:center;color:var(--muted)}

 soit :\n- Inférieur à 8 kg = Susp buv 125 mg/ 5ml : 1 DDP x 2 / jr\n- 09- 16 kg = Susp buv 250 mg/5ml : 1 DDP x 2 / jr\n- 17- 38 kg = Susp buv 500mg/5ml : 1 DDP x 2 /jr\n- Supérieur à 39 kg = cp 500 mg à 1g : 1 cp x 2 /jr\nNB : En per os pendant 5 jours\nAngine : impossibilité du traitement par voie orale :\nBenzathine benzylpénicilline ( Extencilline ) :\n- Poids inférieur à 27 kg : Amp 0,6 MU\n- Poids supérieur à 27 kg : 1,2 MU\nNB : 1 seule injection en IM\nInfection urinaire :\nCéfixime ( Oroken ) susp buv, cp : 8 mg/kg/jr à répartir sur 2 prises, soit :\n- Inférieur à 10 kg = sirop 40 mg : 1 DDP x 2 / jr\n- Supérieur à 10 kg = sirop 100 mg : 1 DDP x 2 / jr\n- Enfant supérieur à 12 ans : cp 200 mg : 1 cp x 2 / jr\nNB : En per os pendant 5 à 10 jours.\nGastro-entérite :\nMétronidazole ( Flagyl ) : Si apyrexie, sirop, cp : 30- 40 mg/kg/jr à répartir sur 3 prises :\n- Inférieur à 13 ans = susp buv 125 mg : 1 cm x 3 / jr en per os pdt 7 jr\n- Supérieur à 13 ans = Flagyl cp : 1 cp x 3 / jr en per os pdt 7 jrs\nSulfaméthoxazole + triméthoprime ( Bactrim ) : Si fièvre ; sirop, cp : 30mg/6mg/jr\n- Inférieur à 13 ans = susp buv 200/40mg : 1 cm/10kg/jr en per os pdt 7 jrs\n- Supérieur à 13 ans = cp 400/80mg : 1 cp x 3 / jr en per os pdt 7 jrs\nMuguet ou Candidose buccale :\nAmphotéricine B ( Fungizone Enfant ) : Application par compresse stérile 2 x / jr\nAntibiotique oculaire : Conjonctivite bactérienne, chalazion ou orgelet :\n- Rifamycine ( Rifamycine ) collyre, pommade : Posologie : 1 gtt/œil x 3 / jr ; 1 application le soir pour pommade\n- Acide fucidique ( Fucithalmic ) collyre : 1 gtt/œil x 2 / jr\n- + lavage au SSI.\nDésencombrement nasal :\nEau de mer stérile ( Stérimar ), spray bébé, spray enfant : 1 pulv/narine x 2 à 6 / jr\n## DOULEUR ABDOMINALE – DIAGNOSTIC PROBABLE\n### Hypochondre droit\nCalcul biliaire\nUlcère gastrique\nPancréatite\n### Épigastre\nUlcère gastrique\nGastrite\nPancréatite\nCalculs biliaires\nHernie épigastrique\nIndigestion\n### Hypochondre gauche\nUlcère gastrique\nUlcère duodénal\nColiques biliaires\nPancréatite\n### Flanc droit\nCalcul rénal\nInfections urinaires\nConstipation\nHernie lombaire\n### Région ombilicale\nPancréatite\nUlcère gastrique\nHernie ombilicale\nDébut d’appendicite\nGastro-entérite\n### Flanc gauche\nCalcul rénal\nDiverticulose\nConstipation\nIntestin inflammatoire\n### Fosse iliaque droite\nAppendicite\nConstipation\nHernie inguinale\n### Région hypogastrique\nInfection urinaire\nAppendicite\nIntestin inflammatoire\nDiverticulose\nInflammation du pelvis\n### Fosse iliaque gauche\nDiverticulose\nInflammation du pelvis\nHernie inguinale\n## VALEURS PHYSIOLOGIQUES NORMALES ET PATHOLOGIQUES\n### Fréquence respiratoire\n|Âge|Normale ( cycles/minute )|Polypnée ( cycles/minute )\n|Naissance à 2 mois|40 à 60|> 60\n|3 mois à 11 mois|30 à 40|> 50\n|12 mois à 5 ans|20 à 30|> 40\n|À partir de 5 ans|12 à 20|> 30\n### Fréquence cardiaque ( pouls )\n|Âge|Normale ( battements/minute )|Tachycardie ( battements/minute )|Bradycardie ( battements/minute )\n|Nouveau-né ( 0 à 28 jours )|100 à 180|> 180|< 100\n|1 mois à 2 ans|90 à 160|> 160|< 90\n|2 ans à 5 ans|80 à 140|> 140|< 80\n|5 ans à 15 ans|60 à 120|> 120|< 60\n### Pression artérielle ( tension artérielle )\n|Âge|PA systolique normale|PA diastolique normale\n|Nouveau-né ( 0 à 28 jrs )|60 – 85|40 – 60\n|1 mois à 12 mois|70 – 110|50 – 60\n|1 an à 10 ans|80 – 110|50 – 70\n|À partir de 10 ans|90 – 130|50 – 80\n## QUELQUES TERMES MÉDICAUX\nAnémie - Déficit en hémoglobine dans le sang\nAnalgésique - Médicament qui soulage la douleur\nArthralgie - Douleur dans une articulation\nCéphalée - Maux de tête\nNéphralgie - Douleur dans les reins\nNévralgie - Douleur nerveuse\nMyalgie - Douleur musculaire\nOtalgie - Douleur à l'oreille\nGastralgie - Douleur de l'estomac\nPyodermite - Infection cutanée avec formation de pus\nLeucoderma - Pigmentation cutanée défectueuse\nHystérodynie - Douleur dans l'utérus\nHystérectomie - Excision de l'utérus\nNéphrectomie - Excision d'un rein\nAdénectomie - Excision d'une glande\nCholécystectomie - Excision de la vésicule biliaire\nThyroïdectomie - Excision de la glande thyroïde\nArthrite - Inflammation d'une articulation\nBronchite - Inflammation des bronches\nCardite - Inflammation du cœur\nCervicite - Inflammation du col de l'utérus\nColite - Inflammation du côlon\nColpite - Inflammation du vagin\nCystite - Inflammation de la vessie\nEntérite - Inflammation des intestins\nGastrite - Inflammation de l'estomac\nGlossite - Inflammation de la langue\nHépatite - Inflammation du foie\nLaryngite - Inflammation du larynx\nMétrite - Inflammation de l'utérus\nMyélite - Inflammation de la moelle épinière\nNéphrite - Inflammation du rein\nPharyngite - Inflammation du pharynx\nBlépharite - Inflammation des paupières\nLithiase biliaire - Pierre ou cailloux dans la vésicule biliaire\nNéphrolithiase - Pierre ou cailloux dans le rein\nOstéomalacie - Adoucissement des os par carence en calcium ou en vitamine D\nAdénome - Tumeur bénigne du tissu glandulaire\nMyome - Tumeur musculaire\nDiplopie - Double vision\nThrombose - Formation d'un caillot sanguin\nPyloromyotomie - Incision du muscle du sphincter pylorique\nHydrophobie - Peur de l'eau\nNeuroplastie - Réparation chirurgicale des nerfs\nPyloraplastie - Incision du pylore et remplacé par un autre en plastique pour élargir le passage\nHémiplégie - Paralysie d'un côté du corps\nNéphroptose - Déplacement vers le bas du rein\nAménorrhée - Absence de pertes menstruelles\nDysménorrhée - Menstruations douloureuses\nLeucorrhée - Pertes vaginales blanchâtres\nMénorrhée - Saignements menstruels\nHémorragie - Fuite de sang d'un vaisseau\nArythmie - Toute déviation du rythme cardiaque normal\nCholestase - Diminution du flux de bile\nL'hémostase - Arrêt du saignement\nNeurasthénie - Débilité nerveuse\nCystostomie - Ouverture chirurgicale pratiquée dans la vessie\nCystotomie - Incision dans la vessie\nHypertrophie - Augmentation de la taille des tissus\nHématurie - Sang dans les urines\nGlycosurie - Présence de sucre dans les urines.\nLeucémie - cancer du sang\n";
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* lecture du texte : sections, sous-titres, lignes, tableaux */
const S=[];let cur=null,grp=null,tbl=null;
function newGrp(t){grp={t:t,items:[]};cur.groups.push(grp)}
RAW.split('\n').forEach(l=>{
  l=l.replace(/\s+$/,'');if(!l)return;
  if(l.startsWith('## ')){cur={t:l.slice(3),groups:[]};S.push(cur);newGrp(null);tbl=null;return}
  if(l.startsWith('### ')){newGrp(l.slice(4));tbl=null;return}
  if(l.startsWith('|')){const c=l.slice(1).split('|');if(!tbl){tbl={type:'t',rows:[]};grp.items.push(tbl)}tbl.rows.push(c);return}
  tbl=null;
  if(l.startsWith('- '))grp.items.push({type:'s',x:l.slice(2)});
  else if(/^NB\b/.test(l))grp.items.push({type:'n',x:l});
  else grp.items.push({type:'l',x:l});
});
const isTerms=s=>/^QUELQUES TERMES/.test(s.t);
function hi(txt,q){
  const e=esc(txt);if(!q)return e;
  /* surligne en ignorant accents/majuscules */
  const n=norm(txt);let out='',i=0;
  while(true){const k=n.indexOf(q,i);if(k<0){out+=esc(txt.slice(i));break}
    out+=esc(txt.slice(i,k))+'<mark>'+esc(txt.slice(k,k+q.length))+'</mark>';i=k+q.length}
  return out}
function lineHtml(it,sec,q){
  const x=it.x;
  if(it.type==='l'&&isTerms(sec)){const k=x.indexOf(' - ');if(k>0&&k<50)return '<b>'+hi(x.slice(0,k),q)+'</b> - '+hi(x.slice(k+3),q)}
  if(it.type!=='n'){const k=x.indexOf(' : ');if(k>0&&k<=70)return '<b>'+hi(x.slice(0,k),q)+'</b> : '+hi(x.slice(k+3),q)}
  return hi(x,q)}
function itemText(it){return it.type==='t'?it.rows.map(r=>r.join(' ')).join(' '):it.x}
let unlocked=false;
function render(){
  const raw=document.getElementById('q').value.trim(),q=norm(raw);
  const out=[];let total=0,secs=0;
  S.forEach((s,si)=>{
    let h='',cnt=0;
    s.groups.forEach(g=>{
      const sm=q&&norm(s.t).includes(q),gm=q&&g.t&&norm(g.t).includes(q);
      const its=g.items.filter(it=>!q||sm||gm||norm(itemText(it)).includes(q));
      if(!its.length)return;
      if(g.t)h+='<div class="sec">'+hi(g.t,q)+'</div>';
      its.forEach(it=>{cnt++;
        if(it.type==='t'){h+='<div class="tw"><table>'+it.rows.map((r,ri)=>'<tr>'+r.map(c=>(ri===0?'<th>':'<td>')+hi(c,q)+(ri===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>'}
        else h+='<div class="it '+(it.type==='s'?'sub':it.type==='n'?'nb':'')+'">'+lineHtml(it,s,q)+'</div>'});
    });
    if(!cnt)return;
    total+=cnt;secs++;
    out.push('<details data-i="'+si+'"'+(q&&unlocked?' open':'')+'><summary><span>'+(unlocked?'':'🔒 ')+hi(s.t,q)+'</span><small>'+cnt+'</small></summary>'+(unlocked?'<div class="body">'+h+'</div>':'')+'</details>');
  });
  document.getElementById('out').innerHTML=out.length?out.join(''):'<div class="none">Aucun résultat pour « '+esc(raw)+' ».</div>';
  document.getElementById('lock').hidden=unlocked;
  document.getElementById('info').textContent=q?(total+' résultat'+(total>1?'s':'')+' · '+secs+' rubrique'+(secs>1?'s':'')):(S.length+' rubriques');
}
const qi=document.getElementById('q');
let t;qi.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,120)});
document.getElementById('clr').onclick=()=>{qi.value='';render();qi.focus()};
const inFrame=window.parent!==window;
function need(i){
  if(!inFrame){alert('Ouvrez cette page depuis le site MON D.E INFAS pour consulter les médicaments.');return}
  window.parent.postMessage({type:'cm-need',i:i},'*')}
document.getElementById('all').onclick=()=>{if(!unlocked)need(-1);else document.querySelectorAll('details').forEach(d=>d.open=true)};
document.getElementById('none').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
document.getElementById('out').addEventListener('click',e=>{
  const s=e.target.closest&&e.target.closest('summary');
  if(s&&!unlocked){e.preventDefault();need(+s.parentNode.getAttribute('data-i'))}});
window.addEventListener('message',e=>{
  if(e.source!==window.parent||!e.data)return;
  if(e.data.type==='cm-state'){unlocked=!!e.data.ok;render()}
  else if(e.data.type==='cm-ok'){unlocked=true;render();
    if(e.data.i===-1)document.querySelectorAll('details').forEach(d=>d.open=true);
    else{const d=document.querySelector('details[data-i="'+e.data.i+'"]');if(d){d.open=true;d.scrollIntoView({block:'start'})}}}
});
render();
if(inFrame)window.parent.postMessage({type:'cm-hello'},'*');
</script>
