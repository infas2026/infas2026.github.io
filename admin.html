<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration – codes d'accès</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:30px auto;padding:0 16px;color:#12303a}
h1{font-size:1.3rem}textarea{width:100%;height:180px;font:15px monospace;padding:8px;box-sizing:border-box}
button{background:#0b7a75;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 6px 0}
button.alt{background:none;color:#0b7a75;border:1px solid #0b7a75}
input[type=number]{width:70px;padding:6px}.ok{color:#16794a}.ko{color:#b3261e}
</style></head><body>
<h1>Générateur de codes d'accès</h1>
<p>1. Choisissez le fichier <b>script.js</b> (version non chiffrée, celle du dossier privé).</p>
<input type="file" id="f" accept=".js">
<p>2. Un code par ligne. <button class="alt" id="gen">Générer</button> <input type="number" id="n" value="5" min="1" max="200"> codes aléatoires</p>
<textarea id="codes" spellcheck="false"></textarea>
<p>3. <button id="go">Créer data.enc.js</button></p>
<p id="msg"></p>
<script>
// BEGIN-CRYPTO
const b64 = u => { let s = ''; for (const x of new Uint8Array(u)) s += String.fromCharCode(x); return btoa(s); };
const norm = c => c.replace(/\s+/g, '').toUpperCase();
async function derive(code, salt, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
}
async function chiffrer(texte, codes) {
  const iter = 200000, salt = crypto.getRandomValues(new Uint8Array(16));
  const K = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const raw = await crypto.subtle.exportKey('raw', K);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, K, new TextEncoder().encode(texte));
  const keys = [];
  for (const c of codes) {
    const d = await derive(c, salt, iter), iv2 = crypto.getRandomValues(new Uint8Array(12));
    keys.push({ iv: b64(iv2), ct: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv2 }, d, raw)) });
  }
  return 'window.ENC=' + JSON.stringify({ iter, salt: b64(salt), keys, iv: b64(iv), ct: b64(ct) }) + ';';
}
function codeAlea() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(12));
  const s = Array.from(r, x => A[x % A.length]).join('');
  return s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8);
}
// END-CRYPTO
const $ = id => document.getElementById(id), msg = (t, c) => { $('msg').textContent = t; $('msg').className = c || ''; };
$('gen').onclick = () => { const l = []; for (let i = 0; i < +$('n').value; i++) l.push(codeAlea()); $('codes').value = ($('codes').value.trim() ? $('codes').value.trim() + '\n' : '') + l.join('\n'); };
$('go').onclick = async () => {
  const f = $('f').files[0], codes = [...new Set($('codes').value.split('\n').map(norm).filter(Boolean))];
  if (!f) return msg('Choisissez d\'abord script.js.', 'ko');
  if (!codes.length) return msg('Ajoutez au moins un code.', 'ko');
  msg('Chiffrement en cours…');
  const out = await chiffrer(await f.text(), codes);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/javascript' }));
  a.download = 'data.enc.js'; a.click();
  msg(codes.length + ' code(s) actif(s). Envoyez data.enc.js sur GitHub (remplace l\'ancien).', 'ok');
};
</script></body></html>
