<style>
:root{
  --bg:#f2f5f8; --card:#ffffff; --ink:#13233a; --muted:#5a6b80; --line:#d6dee8;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1824; --card:#16253a; --ink:#e8eef6; --muted:#9fb0c5; --line:#2a3d57;
    --brand:#4fd1c5; --soft:#12383a; --mark:#7a5f00; --markink:#fff3c4;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1824; --card:#16253a; --ink:#e8eef6; --muted:#9fb0c5; --line:#2a3d57;
  --brand:#4fd1c5; --soft:#12383a; --mark:#7a5f00; --markink:#fff3c4;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
header{padding:16px 14px 8px;max-width:820px;margin:0 auto}
header h1{margin:0;font-size:24px;line-height:1.15}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.sbox{position:relative}
.sbox input{width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.sbox input:focus{border-color:var(--brand)}
.sbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:6px 10px;cursor:pointer;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .chip.on{color:#06201e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#06201e}}
.alpha{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.alpha button{flex:0 0 auto;min-width:28px;border:0;background:transparent;color:var(--brand);font:inherit;font-size:14px;font-weight:700;padding:4px 6px;cursor:pointer}
.alpha button[disabled]{color:var(--line);cursor:default}
.count{font-size:13px;color:var(--muted)}
main{max-width:820px;margin:0 auto;padding:10px 12px 40px}
.letter{margin:18px 2px 6px;font-size:20px;font-weight:800;color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
.card h3{margin:0 0 3px;font-size:16px;line-height:1.25}
.card .cat{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--brand);background:var(--soft);padding:2px 8px;border-radius:999px;vertical-align:middle}
.card p{margin:0;font-size:15px}
mark{background:var(--mark);color:var(--markink);border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>

ide de détection du paludisme à partir d'une goutte de sang."], ["Goutte épaisse", "Examens", "Examen microscopique du sang pour rechercher Plasmodium et mesurer la parasitémie."], ["Examen cytobactériologique des urines (ECBU)", "Examens", "Analyse des urines pour compter les cellules et identifier les germes d'une infection urinaire."], ["Radiographie", "Examens", "Image obtenue par rayons X ; la radiographie de l'abdomen sans préparation montre des niveaux hydro-aériques dans l'occlusion."], ["Échographie", "Examens", "Examen par ultrasons ; l'échographie uro-vésicale montre un globe vésical, les reins, la vessie et la prostate."], ["Fibroscopie", "Examens", "Examen du tube digestif avec un tube souple muni d'une caméra."], ["Urographie", "Examens", "Radiographie des voies urinaires après injection d'un produit de contraste."], ["Lavement baryté", "Examens", "Radiographie du côlon après introduction de baryte ; contre-indiqué en cas de perforation."], ["Électrocardiogramme (ECG)", "Examens", "Enregistrement de l'activité électrique du cœur."], ["Ponction lombaire", "Examens", "Prélèvement de liquide céphalorachidien dans le bas du dos ; contre-indiquée en cas d'hypertension intracrânienne avec risque d'engagement."], ["Liquide céphalorachidien (LCR)", "Examens", "Liquide qui entoure le cerveau et la moelle épinière ; analysé pour diagnostiquer une méningite."], ["Ponction sus-pubienne", "Examens", "Prélèvement ou drainage d'urine à travers la peau au-dessus du pubis, quand le sondage urétral est impossible ou contre-indiqué."], ["Niveaux hydro-aériques", "Examens", "Images radiologiques d'air et de liquide dans l'intestin. Centraux et larges dans l'occlusion du grêle ; périphériques dans l'occlusion du côlon."], ["Hémoculture", "Examens", "Mise en culture de sang pour rechercher des germes (septicémie)."], ["Coproculture", "Examens", "Culture des selles pour identifier un germe."], ["Antibiogramme", "Examens", "Test qui indique à quels antibiotiques un germe est const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.sort((a,b)=>norm(a[0]).localeCompare(norm(b[0]),'fr'));
const E=DATA.map(([t,c,d])=>({t,c,d,nt:norm(t),nd:norm(d)}));
const CATS=['Toutes les catégories',...[...new Set(E.map(e=>e.c))].sort((a,b)=>a==='Sigles'?1:b==='Sigles'?-1:a.localeCompare(b,'fr'))];
let cat=0;
const $=id=>document.getElementById(id);
const q=$('q'),clr=$('clr'),list=$('list'),count=$('count'),chips=$('chips'),alpha=$('alpha');
chips.innerHTML=CATS.map((c,i)=>`<button class="chip${i===0?' on':''}" data-i="${i}">${i===0?'Tout':esc(c)}</button>`).join('');
const letterOf=e=>{const c=e.nt.charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'};
function hl(text,nt,toks){
  if(!toks.length)return esc(text);
  const ranges=[];
  toks.forEach(t=>{let i=0;while((i=nt.indexOf(t,i))>-1){ranges.push([i,i+t.length]);i+=t.length}});
  if(!ranges.length)return esc(text);
  ranges.sort((a,b)=>a[0]-b[0]);
  const m=[];ranges.forEach(r=>{const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push(r.slice())});
  let out='',p=0;
  m.forEach(([a,b])=>{out+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b});
  return out+esc(text.slice(p));
}
function render(){
  const raw=q.value.trim(),nq=norm(raw),toks=nq.split(/\s+/).filter(Boolean);
  clr.style.display=raw?'block':'none';
  let res=E.filter(e=>(cat===0||e.c===CATS[cat])&&toks.every(t=>e.nt.includes(t)||e.nd.includes(t)));
  if(toks.length){
    const score=e=>e.nt===nq?0:e.nt.startsWith(nq)?1:e.nt.includes(nq)?2:toks.every(t=>e.nt.includes(t))?3:4;
    res=res.map((e,i)=>[e,i]).sort((a,b)=>score(a[0])-score(b[0])||a[1]-b[1]).map(x=>x[0]);
  }
  count.textContent=raw?(res.length===0?'Aucun résultat':res.length+' résultat'+(res.length>1?'s':'')+' pour « '+raw+' »'):res.length+' mots et expressions';
  if(!res.length){list.innerHTML='<div class="empty">Aucun mot trouvé. Essayez une autre orthographe ou un mot plus court.</div>';alpha.style.display='none';return}
  let h='',last='',letters=new Set();
  res.forEach(e=>{
    if(!toks.length){const L=letterOf(e);letters.add(L);if(L!==last){h+=`<div class="letter" id="L${L==='#'?'0':L}">${L}</div>`;last=L}}
    h+=`<div class="card"><h3>${hl(e.t,e.nt,toks)}<span class="cat">${esc(e.c)}</span></h3><p>${hl(e.d,e.nd,toks)}</p></div>`;
  });
  list.innerHTML=h;
  if(toks.length){alpha.style.display='none'}else{
    alpha.style.display='flex';
    alpha.innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L=>`<button data-l="${L}"${letters.has(L)?'':' disabled'}>${L}</button>`).join('');
  }
}
q.addEventListener('input',render);
clr.addEventListener('click',()=>{q.value='';render();q.focus()});
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=+b.dataset.i;chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render();window.scrollTo(0,0)});
alpha.addEventListener('click',e=>{const b=e.target.closest('button[data-l]');if(!b||b.disabled)return;const t=document.getElementById('L'+b.dataset.l);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});
