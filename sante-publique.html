<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santé publique – PREPA INFAS 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f8; --card:#ffffff; --ink:#13233a; --muted:#5a6b80; --line:#d6dee8;
  --brand:#0b6e75; --brand-ink:#ffffff; --soft:#dff1f1;
  --ok:#17794a; --ok-bg:#e1f4ea; --ko:#b83a32; --ko-bg:#fbe7e5; --warn:#8a5a00; --warn-bg:#fff2d1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1824; --card:#16253a; --ink:#e8eef6; --muted:#9fb0c5; --line:#2a3d57;
    --brand:#4cc3c9; --brand-ink:#08222a; --soft:#173a44;
    --ok:#62d697; --ok-bg:#12382a; --ko:#ff8a80; --ko-bg:#40201f; --warn:#f2c35c; --warn-bg:#3b2f10;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1824; --card:#16253a; --ink:#e8eef6; --muted:#9fb0c5; --line:#2a3d57;
  --brand:#4cc3c9; --brand-ink:#08222a; --soft:#173a44;
  --ok:#62d697; --ok-bg:#12382a; --ko:#ff8a80; --ko-bg:#40201f; --warn:#f2c35c; --warn-bg:#3b2f10;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
header{padding:22px 16px 14px;max-width:760px;margin:0 auto}
header h1{font-size:30px;font-weight:800}
header p{margin:6px 0 0;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:760px;margin:0 auto;display:flex;gap:6px;padding:8px 12px}
nav button{flex:1;font:inherit;font-weight:700;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:12px 12px 60px}
section[hidden]{display:none}
.group{margin:22px 0 8px;font-size:21px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card h3{font-size:17px;margin-bottom:8px}
.eq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-x:auto;padding:4px 0}
.eq .lhs{font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;text-align:center}
.frac .n{padding:0 8px 3px;border-bottom:2px solid var(--ink)}
.frac .d{padding:3px 8px 0}
.mult{font-weight:700}
.note{color:var(--muted);font-size:14px;margin-top:6px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
dl{margin:0}
dl div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}
dt{font-weight:700;min-width:64px;color:var(--brand)}
dd{margin:0}
.data td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.q{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.q.ok{border-color:var(--ok);background:var(--ok-bg)}
.q.ko{border-color:var(--ko);background:var(--ko-bg)}
.q label{display:block;font-weight:700;margin-bottom:8px}
.q .row{display:flex;align-items:center;gap:8px}
.q input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.q .unit{color:var(--muted);font-size:14px;max-width:46%}
.fb{margin-top:10px;font-size:15px}
.fb .verdict{font-weight:800}
.q.ok .verdict{color:var(--ok)} .q.ko .verdict{color:var(--ko)}
.calc{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;margin:18px 0}
.btn{flex:1;font:inherit;font-weight:800;padding:14px;border-radius:12px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--brand)}
.result{border-radius:14px;padding:16px;margin:14px 0;background:var(--soft)}
.result .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:44px;font-weight:800;line-height:1}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--brand);width:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:700;font-size:14px}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .4s}}
</style>
</head>
<body>
<header>
  <h1>Santé publique</h1>
  <p>Les 76 formules de santé publique, vaccination PEV et exercice à traiter en ligne avec correction.</p>
</header>
<nav><div class="in" role="tablist">
  <button role="tab" aria-selected="true" data-t="formules">Formules</button>
  <button role="tab" aria-selected="false" data-t="pev">PEV et sigles</button>
  <button role="tab" aria-selected="false" data-t="exo">Exercice</button>
</div></nav>
<main>
  <section id="formules"></section>
  <section id="pev" hidden></section>
  <section id="exo" hidden></section>
</main>

<script>
/* ---------- Outils d'affichage ---------- */
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function frac(n,d){return '<span class="frac"><span class="n">'+esc(n)+'</span><span class="d">'+esc(d)+'</span></span>'}
function eq(lhs,n,d,mult){
  return '<div class="eq"><span class="lhs">'+esc(lhs)+' =</span>'+(d?frac(n,d):'<span>'+esc(n)+'</span>')+(mult?'<span class="mult">× '+mult+'</span>':'')+'</div>';
}

/* ---------- Formules ---------- */
/* Source : « Formules de Santé Publique » (actualisées, rédigées par IDE GBOKO ANGE AXEL, TEAM GBOKO INFAS DALOA), 76 formules.
   Chaque formule : num (numéro du document), t (titre), eqs (équations : lhs = membre de gauche, n = numérateur, d = dénominateur, m = multiplicateur), note (facultatif). */
function pc(num,t,pct,dec){return {num:num,t:t,eqs:[{lhs:"PC",n:pct+" × Pt"},{lhs:"Pt",n:"PC",d:dec}]}}
const F=[
 {g:"Populations cibles",intro:"Toutes les populations cibles se calculent avec la population totale (Pt, au 31/12 de l'année en cours). On ne prend pas la population moyenne. PC = population cible.",items:[
  pc("1","Enfants de 0 à 6 mois","1,45 %","0,0145"),
  pc("2","Enfants de 0 à 11 mois","3,5 %","0,035"),
  pc("3","Enfants de 0 à 23 mois","6,82 %","0,0682"),
  pc("4","Enfants de 0 à 59 mois (0 à 5 ans)","20 %","0,2"),
  pc("5","Enfants de 12 à 23 mois","3,32 %","0,0332"),
  pc("6","Enfants de 9 mois à 14 ans","45 %","0,45"),
  pc("7","Enfants de 1 à 4 ans","17,32 %","0,1732"),
  pc("8","Jeunes filles de 9 ans","1,86 %","0,0186"),
  pc("9","Enfants de 9 à 13 ans","6 %","0,06"),
  {num:"10",t:"Femmes en âge de reproduction ou de procréer (FAR)",eqs:[{lhs:"FAR",n:"20 % × Pt"},{lhs:"Pt",n:"FAR",d:"0,2"}]},
  pc("11","Femmes enceintes ou grossesses attendues","5 %","0,05"),
  {num:"12",t:"Femmes séropositives",eqs:[{lhs:"PC",n:"4,1 % × Grossesses attendues"},{lhs:"GA",n:"PC",d:"0,041"}],note:"GA = grossesses attendues."},
  pc("13","Naissances attendues ou accouchements attendus","4,7 %","0,047")
 ]},
 {g:"Population totale",intro:"À retenir : si on donne la population au 01/01 et la population au 31/12 de la même année, il faut calculer la population moyenne, même si l'exercice ne le précise pas. La population moyenne est prioritaire sur la population totale.",items:[
  {num:"14",t:"Équation de projection",eqs:[{lhs:"Pt",n:"P0 (1 + r)^t"}],note:"P0 = population de départ ; r = TAA (taux d'accroissement annuel) ; t = temps."},
  {num:"15",t:"Équation fondamentale",eqs:[{lhs:"Pt",n:"P0 + AN + SM"}],note:"AN = accroissement naturel ; SM = solde migratoire."},
  {num:"16",t:"Solde migratoire",eqs:[{lhs:"SM",n:"Immigrés − Émigrés"}]},
  {num:"17",t:"Accroissement naturel",eqs:[{lhs:"AN",n:"Naissances en une année − Décès en une année"}]},
  {num:"18",t:"Population moyenne",eqs:[{lhs:"Pop M",n:"Pop de départ + Pop d'arrivée",d:"2"}],note:"La population de départ et la population d'arrivée doivent être de la même année."},
  {num:"19",t:"Taux brut de natalité (TBN)",eqs:[{lhs:"TBN",n:"Naissances vivantes en 1 an",d:"Pop totale ou moyenne",m:"100"}],note:"On peut multiplier par 10^n (1000 si l'énoncé le demande)."},
  {num:"20",t:"Taux brut de mortalité (TBM)",eqs:[{lhs:"TBM",n:"Effectif des décès",d:"Pop totale ou moyenne",m:"100"}]},
  {num:"21",t:"Taux brut de morbidité (TBm)",eqs:[{lhs:"TBm",n:"Effectif des malades",d:"Pop totale ou moyenne",m:"100"}]}
 ]},
 {g:"Fécondité, croissance et morbidité",items:[
  {num:"22",t:"Taux général de fécondité (TGF)",eqs:[{lhs:"TGF",n:"Naissances vivantes en une année",d:"Nombre de FAR en une année",m:"100"}]},
  {num:"23",t:"Taux d'accroissement naturel (TAN)",eqs:[{lhs:"TAN",n:"Accroissement naturel",d:"Pop fin d'année",m:"100"}]},
  {num:"24",t:"Taux d'accroissement annuel (TAA)",eqs:[{lhs:"TAA",n:"Pop d'arrivée − Pop de départ",d:"Pop de départ",m:"100"},{lhs:"TAA = r",n:"Pt",d:"P0"}],note:"Deuxième forme : TAA = r = (Pt / P0) − 1, dans le cas où t = 1 dans l'équation de projection."},
  {num:"25",t:"Taux d'accouchement assisté (TAccA)",eqs:[{lhs:"TAccA",n:"Effectif des femmes assistées pendant l'accouchement",d:"Nombre d'accouchements attendus la même année",m:"100"}],note:"On considère les accouchements effectués par le médecin, l'IDE, la SF, le maïeuticien et l'accoucheuse traditionnelle."},
  {num:"26",t:"Taux d'incidence (TI)",eqs:[{lhs:"TI",n:"Effectif des nouveaux cas de la maladie",d:"Pop totale ou moyenne",m:"100"}]},
  {num:"27",t:"Taux de prévalence (TP)",eqs:[{lhs:"TP",n:"Effectif de tous les cas de la maladie (anciens + nouveaux cas)",d:"Pop totale ou moyenne",m:"100"}]},
  {num:"28",t:"Taux de létalité (TL)",eqs:[{lhs:"TL",n:"Total des décès causés par une maladie",d:"Nombre de cas de cette maladie",m:"100"}]}
 ]},
 {g:"Taux de mortalité",items:[
  {num:"29",t:"Taux de mortalité spécifique (TMS)",eqs:[{lhs:"TMS",n:"Total de décès de la maladie la même année",d:"Pop totale",m:"100"}]},
  {num:"30",t:"Taux de mortalité infantile (TMI)",eqs:[{lhs:"TMI",n:"Nombre d'enfants de 0 à 11 mois décédés",d:"Total des naissances vivantes",m:"100"}]},
  {num:"31",t:"Taux de mortalité juvénile (TMJ)",eqs:[{lhs:"TMJ",n:"Nombre d'enfants de 1 à 4 ans décédés",d:"Enfants de 1 à 4 ans",m:"100"}]},
  {num:"32",t:"Taux de mortalité maternelle (TMM)",eqs:[{lhs:"TMM",n:"Effectif des décès maternels dans une année",d:"Naissances vivantes de la même année",m:"100"}]},
  {num:"33",t:"Taux de mortalité néonatale (TMN)",eqs:[{lhs:"TMN",n:"Nombre de décès d'enfants de 0 à moins de 28 jours",d:"Total de naissances vivantes",m:"100"}]},
  {num:"34",t:"Taux de mortalité néonatale précoce (TMNP)",eqs:[{lhs:"TMNP",n:"Nombre de décès d'enfants de 0 à moins de 8 jours",d:"Total de naissances vivantes",m:"100"}]},
  {num:"35",t:"Taux de mortalité néonatale tardive (TMNT)",eqs:[{lhs:"TMNT",n:"Nombre de décès d'enfants de 8 à moins de 28 jours",d:"Total de naissances vivantes",m:"100"}]},
  {num:"36",t:"Taux de mortalité post-néonatale (TMPN)",eqs:[{lhs:"TMPN",n:"Nombre de décès d'enfants de 28 jours à 11 mois",d:"Total de naissances vivantes",m:"100"}]}
 ]},
 {g:"Doublement, besoins et vaccination",items:[
  {num:"37",t:"Temps de doublement (TD)",eqs:[{lhs:"TD",n:"70",d:"TAA"}]},
  {num:"38",t:"Année de doublement (AD)",eqs:[{lhs:"AD",n:"AR + TD"}],note:"AR = année de référence."},
  {num:"38 bis",t:"Besoin théorique ou quantité théorique (BT)",eqs:[{lhs:"BT",n:"Pop cible × Objectif vaccinal × Nbre de contacts × Facteur de perte × Période",d:"12"}],note:"Période : BT mensuel → 1 ; trimestriel → 3 ; semestriel → 6 ; annuel → 12."},
  {num:"39",t:"Stock de sécurité en antigène (vaccin)",eqs:[{lhs:"SS",n:"25 % × BT"},{lhs:"SS",n:"25 × BT",d:"100"}]},
  {num:"40",t:"Stock de sécurité en consommables (seringues…)",eqs:[{lhs:"SS",n:"10 % × BT"},{lhs:"SS",n:"10 × BT",d:"100"}]},
  {num:"41",t:"Besoin réel (BR)",eqs:[{lhs:"BR",n:"BT + SS"}]},
  {num:"42",t:"Quantité à commander (QC)",eqs:[{lhs:"QC",n:"BR − Quantité en stock"}]},
  {num:"43",t:"Taux de couverture vaccinale (TCV)",eqs:[{lhs:"TCV",n:"Doses administrées sur une période",d:"Pop cible de cette période",m:"100"},{lhs:"TCV",n:"Nombre de personnes vaccinées",d:"Nombre de personnes attendues",m:"100"}]},
  {num:"44",t:"Taux de perte (TP)",eqs:[{lhs:"TP",n:"Doses sorties − Doses administrées",d:"Doses sorties",m:"100"},{lhs:"TP",n:"100 − TU"}]},
  {num:"45",t:"Taux d'utilisation (TU)",eqs:[{lhs:"TU",n:"Doses effectivement administrées pendant une période",d:"Nombre de doses sorties pendant la même période",m:"100"},{lhs:"TU",n:"100 − Taux de perte"}]},
  {num:"46",t:"Facteur de perte (FP)",eqs:[{lhs:"FP",n:"100",d:"100 − Taux de perte"},{lhs:"FP",n:"100",d:"TU"}]},
  {num:"47",t:"Taux d'abandon spécifique (TAS)",eqs:[{lhs:"TAS",n:"Penta1 − Penta3",d:"Penta1",m:"100"},{lhs:"TAS",n:"Td1 − Td3",d:"Td1"},{lhs:"TAS",n:"VPO0 − VPO4",d:"VPO0"}]},
  {num:"48",t:"Taux d'abandon global (TAG)",eqs:[{lhs:"TAG",n:"Penta1 − RR1",d:"Penta1",m:"100"}],note:"Matériel : nombre de seringues à injection = nombre de doses ; une seringue à dilution pour 1 flacon de vaccin à reconstituer ; une boîte de sécurité pour 100 seringues."}
 ]},
 {g:"Gestion financière (monitorage)",items:[
  {num:"49",t:"Fonds de réserve (FR)",eqs:[{lhs:"FR",n:"SB − Recettes des six mois couverts par le monitorage"},{lhs:"FR",n:"SB + Intérêts − Agios"},{lhs:"FR",n:"SBmb − SAB"}],note:"SB = somme à la banque à la veille du monitorage ; SBmb = somme à la banque après mouvements bancaires."},
  {num:"50",t:"Somme à budgétiser (SAB)",eqs:[{lhs:"SAB",n:"RVME + RCAS"},{lhs:"SAB",n:"DO + DFL"}],note:"RVME = recettes issues de la vente des médicaments essentiels ; RCAS = recettes issues du coût des actes de santé ; DO = dépenses obligatoires ou incompressibles ; DFL = dépenses de fonctionnement local."},
  {num:"51",t:"Imprévus",eqs:[{lhs:"Imp",n:"5 % × DFL"}]},
  {num:"52",t:"Immeuble",eqs:[{lhs:"Im",n:"10 % × DFL"}]},
  {num:"53",t:"Autres dépenses",eqs:[{lhs:"AD",n:"85 % × DFL"}]},
  {num:"54",t:"Fonds d'aide sociale (FAS)",eqs:[{lhs:"FAS",n:"10 % × Recettes brutes"}]},
  {num:"55",t:"Intéressement du personnel (IP)",eqs:[{lhs:"IP",n:"15 % × Recettes brutes"}]},
  {num:"56",t:"Salaire du personnel de soutien (SPS)",eqs:[{lhs:"SPS",n:"20 % × Recettes brutes"}]},
  {num:"57",t:"Total des dépenses du centre (TDC)",eqs:[{lhs:"TDC",n:"FAS + IP + SPS"},{lhs:"TDC",n:"45 % × Recettes brutes"}]},
  {num:"58",t:"Ressources propres (RP)",eqs:[{lhs:"RP",n:"SAB + Recettes des 6 mois couverts par le monitorage"},{lhs:"RP",n:"Recettes brutes − TDC"},{lhs:"RP",n:"55 % × Recettes brutes"}]},
  {num:"59",t:"Mouvements bancaires",eqs:[],table:[["Intérêts y compris","Somme à la banque + 0"],["Intérêts non compris","Somme à la banque + le montant des intérêts"],["Agios y compris","Somme à la banque − le montant des agios"],["Agios non compris","Somme à la banque − 0"]],tableHead:["Cas","Somme à la banque"]}
 ]},
 {g:"Structure de la population",items:[
  {num:"60",t:"Proportion des femmes",eqs:[{lhs:"PF",n:"Nombre de femmes",d:"Pop totale",m:"100"}]},
  {num:"61",t:"Proportion des hommes",eqs:[{lhs:"PH",n:"Nombre d'hommes",d:"Pop totale",m:"100"}]},
  {num:"62",t:"Rapport de masculinité (Rm)",eqs:[{lhs:"Rm",n:"Nombre d'hommes",d:"Nombre de femmes",m:"100"}],note:"On peut aussi multiplier par 10^n."},
  {num:"63",t:"Taux d'urbanisation (Turb)",eqs:[{lhs:"Turb",n:"Pop urbaine",d:"Pop totale",m:"100"}]},
  {num:"64",t:"Densité globale (d)",eqs:[{lhs:"d",n:"Population totale",d:"Superficie totale"}]},
  {num:"65",t:"Densité rurale",eqs:[{lhs:"d rur",n:"Pop rurale",d:"Superficie rurale"}]},
  {num:"66",t:"Densité urbaine",eqs:[{lhs:"d urb",n:"Pop urbaine",d:"Superficie urbaine"}]},
  {num:"67",t:"Densité agricole",eqs:[{lhs:"d agr",n:"Population rurale",d:"Superficie agricole"}]},
  {num:"68",t:"Âge modal",eqs:[],note:"Dans une série d'âges, c'est l'âge qui a le plus grand effectif."},
  {num:"69",t:"Âge moyen",eqs:[{lhs:"Âge moyen",n:"Somme de chaque âge",d:"Total des personnes ou des cases d'un tableau"}]},
  {num:"70",t:"Âge médian",eqs:[{lhs:"Âge médian",n:"Le plus petit âge du tableau + Le plus grand âge du tableau",d:"2"}]}
 ]},
 {g:"Déterminants de couverture (monitorage)",items:[
  {num:"71",t:"Population cible du monitorage (PCm)",eqs:[{lhs:"PCm",n:"PC",d:"2"}],note:"PC : voir les formules 1 à 13. Précision : vaccination → PC = 6,82 % × Pt ; CPN recentrée → PC = 5 % × Pt ; consultation et soins curatifs → PC = 100 % × Pt. Dans les trois cas, PCm = PC / 2."},

    {h:"CPNr",eqs:[{lhs:"US",n:"Pop cible ayant effectué au moins une CPNr",d:"Pop cible du monitorage",m:"100"}]},

function parse(v){
  v=String(v).trim().replace(/\s/g,'').replace(/\u00a0/g,'').replace(',','.').replace('%','');
  if(v==='')return null; const n=Number(v); return isNaN(n)?null:n;
}
function updateCount(){
  let c=0; Q.forEach((q,i)=>{if(parse(document.getElementById('i'+i).value)!==null)c++});
  document.getElementById('cnt').textContent=c+' / '+Q.length;
}
document.getElementById('exo').addEventListener('input',updateCount);

/* La correction demande un code d'accès : la demande passe par le site (page parente). */
document.getElementById('go').onclick=function(){
  if(window.parent===window){alert('Ouvrez cette page depuis le site MON D.E INFAS pour utiliser la correction.');return}
  window.parent.postMessage({type:'sp-correct'},'*');
};
window.addEventListener('message',function(e){
  if(e.source===window.parent && e.data && e.data.type==='sp-correct-ok')runCorrection();
});
function runCorrection(){
  let ok=0;
  Q.forEach((q,i)=>{
    const v=parse(document.getElementById('i'+i).value);
    const good=v!==null && Math.abs(v-q[2])<=q[3];
    if(good)ok++;
    const box=document.getElementById('q'+i);
    box.className='q '+(good?'ok':'ko');
    document.getElementById('f'+i).innerHTML=
      '<div class="verdict">'+(good?'Bonne réponse':(v===null?'Pas de réponse':'Réponse incorrecte'))+'</div>'+
      (good?'':'<div>Bonne réponse : <b>'+esc(q[5])+' '+esc(q[1])+'</b></div>')+
      '<div class="calc">'+esc(q[4])+'</div>';
  });
  const note=Math.round(ok/Q.length*200)/10;
  const msg=note>=16?'Excellent, tu maîtrises les formules.':note>=12?'Bien. Revois les erreurs ci-dessus.':note>=10?'Moyen. Relis les formules puis recommence.':'À retravailler : relis l\'onglet Formules puis recommence.';
  const r=document.getElementById('res');
  r.hidden=false;
  r.innerHTML='<div class="big">'+String(note).replace('.',',')+' / 20</div><div style="margin-top:6px"><b>'+ok+' bonnes réponses sur '+Q.length+'</b></div><div class="progress"><i style="width:'+(ok/Q.length*100)+'%"></i></div><div class="note">'+msg+'</div>';
  r.scrollIntoView({block:'center'});
}
document.getElementById('rs').onclick=function(){
  Q.forEach((q,i)=>{document.getElementById('i'+i).value='';document.getElementById('q'+i).className='q';document.getElementById('f'+i).innerHTML='';});
  document.getElementById('res').hidden=true; updateCount(); window.scrollTo({top:0});
};
